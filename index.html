<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Smart Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
        }

        .calculator {
            width: 380px;
            padding: 25px;
            border-radius: 25px;
            background: #1e293b;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 25px;
            letter-spacing: 2px;
        }

        .display {
            background: #020617;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: right;
            overflow: hidden;
        }

        #expression {
            color: #94a3b8;
            font-size: 16px;
            min-height: 25px;
        }

        #display {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 38px;
            text-align: right;
            margin-top: 5px;
        }

        .scientific {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 58px;
            border: none;
            border-radius: 15px;
            background: #334155;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.05);
            background: #475569;
        }

        .operator {
            background: #475569;
        }

        .special {
            background: #64748b;
        }

        .equal {
            background: #2563eb;
        }

        .equal:hover {
            background: #3b82f6;
        }

        .clear {
            background: #dc2626;
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            margin-top: 20px;
        }

        .history h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        #history {
            max-height: 130px;
            overflow-y: auto;
            background: #020617;
            border-radius: 12px;
            padding: 10px;
        }

        .history-item {
            padding: 7px;
            border-bottom: 1px solid #334155;
            font-size: 14px;
            color: #cbd5e1;
        }

        .empty {
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="title">
        ⚡ NEXUS CALCULATOR
    </div>

    <div class="display">
        <div id="expression"></div>
        <input id="display" value="0" readonly>
    </div>

    <!-- Scientific buttons -->
    <div class="scientific">

        <button onclick="scientific('sin')">sin</button>
        <button onclick="scientific('cos')">cos</button>
        <button onclick="scientific('tan')">tan</button>
        <button onclick="scientific('sqrt')">√</button>

        <button onclick="scientific('log')">log</button>
        <button onclick="scientific('ln')">ln</button>
        <button onclick="scientific('square')">x²</button>
        <button onclick="scientific('power')">xʸ</button>

    </div>

    <!-- Main calculator -->
    <div class="buttons">

        <button class="clear" onclick="clearCalculator()">AC</button>
        <button class="special" onclick="deleteNumber()">⌫</button>
        <button class="special" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button class="zero" onclick="addNumber('0')">0</button>
        <button onclick="addNumber('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <!-- History -->
    <div class="history">

        <h3>📜 Calculation History</h3>

        <div id="history">
            <div class="empty">
                No calculations yet
            </div>
        </div>

    </div>

</div>

<script>

    let currentNumber = "";
    let previousNumber = "";
    let operator = "";
    let history = [];

    const display = document.getElementById("display");
    const expression = document.getElementById("expression");
    const historyBox = document.getElementById("history");


    // Add number
    function addNumber(number) {

        if (number === "." && currentNumber.includes(".")) {
            return;
        }

        if (currentNumber === "0" && number !== ".") {
            currentNumber = "";
        }

        currentNumber += number;

        display.value = currentNumber;
    }


    // Choose operator
    function chooseOperator(op) {

        if (currentNumber === "") {
            return;
        }

        if (previousNumber !== "") {
            calculate();
        }

        operator = op;

        previousNumber = currentNumber;

        currentNumber = "";

        expression.innerText =
            previousNumber + " " + operator;
    }


    // Calculate
    function calculate() {

        if (
            previousNumber === "" ||
            currentNumber === "" ||
            operator === ""
        ) {
            return;
        }

        let a = parseFloat(previousNumber);
        let b = parseFloat(currentNumber);
        let result;


        switch (operator) {

            case "+":
                result = a + b;
                break;

            case "-":
                result = a - b;
                break;

            case "*":
                result = a * b;
                break;

            case "/":

                if (b === 0) {
                    display.value = "Error";
                    return;
                }

                result = a / b;
                break;
        }


        result = Number(result.toFixed(10));

        expression.innerText =
            previousNumber +
            " " +
            operator +
            " " +
            currentNumber +
            " =";


        display.value = result;

        addHistory(
            previousNumber +
            " " +
            operator +
            " " +
            currentNumber +
            " = " +
            result
        );


        currentNumber = result.toString();
        previousNumber = "";
        operator = "";
    }


    // Percentage
    function percentage() {

        if (currentNumber === "") {
            return;
        }

        currentNumber =
            (parseFloat(currentNumber) / 100).toString();

        display.value = currentNumber;
    }


    // Delete
    function deleteNumber() {

        currentNumber =
            currentNumber.slice(0, -1);

        if (currentNumber === "") {
            display.value = "0";
        } else {
            display.value = currentNumber;
        }
    }


    // Clear
    function clearCalculator() {

        currentNumber = "";
        previousNumber = "";
        operator = "";

        display.value = "0";
        expression.innerText = "";
    }


    // Scientific calculator
    function scientific(type) {

        if (currentNumber === "") {
            return;
        }

        let number = parseFloat(currentNumber);
        let result;


        switch (type) {

            case "sin":

                result =
                    Math.sin(number * Math.PI / 180);

                break;


            case "cos":

                result =
                    Math.cos(number * Math.PI / 180);

                break;


            case "tan":

                result =
                    Math.tan(number * Math.PI / 180);

                break;


            case "sqrt":

                if (number < 0) {
                    display.value = "Error";
                    return;
                }

                result = Math.sqrt(number);

                break;


            case "log":

                if (number <= 0) {
                    display.value = "Error";
                    return;
                }

                result = Math.log10(number);

                break;


            case "ln":

                if (number <= 0) {
                    display.value = "Error";
                    return;
                }

                result = Math.log(number);

                break;


            case "square":

                result = number * number;

                break;


            case "power":

                let power =
                    prompt("Enter power:");

                if (power === null) {
                    return;
                }

                result =
                    Math.pow(number, parseFloat(power));

                break;
        }


        result = Number(result.toFixed(10));

        expression.innerText =
            type + "(" + number + ") =";

        display.value = result;

        addHistory(
            type + "(" + number + ") = " + result
        );

        currentNumber = result.toString();
    }


    // History
    function addHistory(text) {

        history.unshift(text);

        if (history.length > 10) {
            history.pop();
        }

        historyBox.innerHTML = "";

        history.forEach(item => {

            const div =
                document.createElement("div");

            div.className = "history-item";

            div.innerText = item;

            historyBox.appendChild(div);

        });
    }


    // Keyboard support
    document.addEventListener("keydown", function(event) {

        const key = event.key;


        if (!isNaN(key) || key === ".") {

            addNumber(key);

        }

        else if (
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/"
        ) {

            chooseOperator(key);

        }

        else if (key === "Enter" || key === "=") {

            calculate();

        }

        else if (key === "Backspace") {

            deleteNumber();

        }

        else if (key === "Escape") {

            clearCalculator();

        }

        else if (key === "%") {

            percentage();

        }

    });

</script>

</body>
</html>
